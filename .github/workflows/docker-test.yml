name: 🐳 Docker Testing

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'install.sh'
      - 'tests/docker/**'
      - '.github/workflows/docker-test.yml'
      - '!**.md'
      - '!docs/**'
      - '!.plan/**'
      - '!README*'
      - '!LICENSE'
      - '!CHANGELOG*'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'install.sh'
      - 'tests/docker/**'
      - '.github/workflows/docker-test.yml'
      - '!**.md'
      - '!docs/**'
      - '!.plan/**'
      - '!README*'
      - '!LICENSE'
      - '!CHANGELOG*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docker-test:
    name: 🧪 Docker-based Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build server test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/docker/Dockerfile.server
          tags: ptty-tmux-server:latest
          load: true
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: 🔨 Build client test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/docker/Dockerfile.client
          tags: ptty-tmux-client:latest
          load: true
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

      - name: 🚀 Start test environment
        run: |
          cd tests/docker
          docker compose up -d

          echo "⏳ Waiting for services to be ready..."
          sleep 10

          # Check containers are running
          docker compose ps

      - name: ✅ Verify server health
        run: |
          echo "🔍 Checking server container health..."
          docker exec tmux-test-server test-console.sh

      - name: 🧪 Run status bar suite (non-interactive)
        run: |
          echo "🧪 Running status bar suite inside a real tmux session..."
          STATUS_BAR_EXIT=$(docker exec -u testuser tmux-test-server bash -c '
            tmux new-session -d -s status-bar-test -n runner \
              "bash /tmp/ptty/tests/run-all-tests.sh --non-interactive; echo \$? > /tmp/status-bar-exit.txt; tmux wait-for -S status-bar-done"
            tmux wait-for status-bar-done
            cat /tmp/status-bar-exit.txt
          ' | tail -1)
          echo "Exit code: $STATUS_BAR_EXIT"
          if [ "$STATUS_BAR_EXIT" != "0" ]; then
            echo "❌ Status bar suite failed"
            exit 1
          fi
          echo "✅ Status bar suite passed"

      - name: 🧪 Run automated tests
        id: tests
        run: |
          echo "🧪 Running automated test suite..."

          # Create results file
          RESULTS_FILE=$(mktemp)
          FAILED=false

          # Run tests in client container
          echo "📋 Client Container Tests:" | tee -a "$RESULTS_FILE"
          if docker exec tmux-test-client run-tests.sh | tee -a "$RESULTS_FILE"; then
            echo "✅ Client tests passed"
          else
            echo "❌ Client tests failed"
            FAILED=true
          fi

          # Test from host
          echo ""
          echo "🧪 Testing from host..."
          echo "" >> "$RESULTS_FILE"
          echo "📋 Host Tests:" >> "$RESULTS_FILE"

          # Install sshpass for testing
          sudo apt-get update && sudo apt-get install -y sshpass

          # Test SSH connection
          echo -n "Test: SSH connection... "
          if sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost "echo ok" > /dev/null 2>&1; then
            echo "✅ PASSED" | tee -a "$RESULTS_FILE"
          else
            echo "❌ FAILED" | tee -a "$RESULTS_FILE"
            FAILED=true
          fi

          # Test tmux sessions. Count console-* by name, not `tmux ls | wc -l`
          # (that also counts non-console sessions like `help`).
          echo -n "Test: Tmux sessions... "
          SESSION_COUNT=$(sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost "tmux list-sessions -F '#{session_name}' 2>/dev/null | grep -c '^console-'")
          if [ "$SESSION_COUNT" -eq 10 ]; then
            echo "✅ PASSED (10 sessions)" | tee -a "$RESULTS_FILE"
          else
            echo "❌ FAILED (found $SESSION_COUNT sessions)" | tee -a "$RESULTS_FILE"
            FAILED=true
          fi

          # Test multi-user
          echo -n "Test: Multi-user support... "
          if sshpass -p devpassword ssh -p 2222 -o StrictHostKeyChecking=no devuser@localhost "tmux ls" > /dev/null 2>&1; then
            echo "✅ PASSED" | tee -a "$RESULTS_FILE"
          else
            echo "❌ FAILED" | tee -a "$RESULTS_FILE"
            FAILED=true
          fi

          # Keybinding smoke test: switch-client needs an attached client,
          # which SSH/docker exec do not provide, so assert every session
          # the F1-F10 bindings target actually exists instead.
          echo -n "Test: Console keybinding targets (console-1..10)... "
          BINDING_OK=true
          for i in $(seq 1 10); do
            if ! sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost "tmux has-session -t console-$i" > /dev/null 2>&1; then
              BINDING_OK=false
            fi
          done
          if [ "$BINDING_OK" = "true" ]; then
            echo "✅ PASSED" | tee -a "$RESULTS_FILE"
          else
            echo "❌ FAILED (a console-N session is missing)" | tee -a "$RESULTS_FILE"
            FAILED=true
          fi

          # ExecStop-scoping test (T06). No systemd in this container, so
          # the src/tmux-console.service ExecStop command line is run
          # directly. Asserts it kills only console-1..10 and leaves an
          # unrelated session alone, then recreates the consoles.
          echo -n "Test: ExecStop scoping leaves other sessions alone... "
          sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost "tmux new-session -d -s mywork" > /dev/null 2>&1
          sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost \
            "bash -c 'for i in \$(seq 1 10); do tmux kill-session -t =console-\$i 2>/dev/null; done; true'" > /dev/null 2>&1
          MYWORK_ALIVE=$(sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost "tmux has-session -t mywork" > /dev/null 2>&1 && echo yes || echo no)
          CONSOLES_LEFT=$(sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost "tmux list-sessions -F '#{session_name}' 2>/dev/null | grep -c '^console-'" || true)
          sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost "tmux kill-session -t mywork; bash ~/.tmux-persistent-console/setup.sh" > /dev/null 2>&1
          if [ "$MYWORK_ALIVE" = "yes" ] && [ "$CONSOLES_LEFT" -eq 0 ]; then
            echo "✅ PASSED" | tee -a "$RESULTS_FILE"
          else
            echo "❌ FAILED (mywork=$MYWORK_ALIVE, consoles left=$CONSOLES_LEFT)" | tee -a "$RESULTS_FILE"
            FAILED=true
          fi

          # Upgrade path (T12): simulate the old "5 consoles" layout, re-run
          # setup.sh (idempotent), assert all 10 exist. setup.sh-level only —
          # this container has no systemd, so the unit re-registration path
          # on a real host upgrade is NOT covered here.
          echo -n "Test: Upgrade from 5 to 10 consoles... "
          sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost \
            "bash -c 'for i in \$(seq 1 10); do tmux kill-session -t =console-\$i 2>/dev/null; done; for i in \$(seq 1 5); do tmux new-session -d -s console-\$i; done'" > /dev/null 2>&1
          sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost "bash ~/.tmux-persistent-console/setup.sh" > /dev/null 2>&1
          UPGRADED_COUNT=$(sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost "tmux list-sessions -F '#{session_name}' 2>/dev/null | grep -c '^console-'")
          if [ "$UPGRADED_COUNT" -eq 10 ]; then
            echo "✅ PASSED (10 sessions after upgrade)" | tee -a "$RESULTS_FILE"
          else
            echo "❌ FAILED (found $UPGRADED_COUNT sessions after upgrade)" | tee -a "$RESULTS_FILE"
            FAILED=true
          fi

          # Save results for summary
          echo "RESULTS_FILE=$RESULTS_FILE" >> $GITHUB_OUTPUT
          if [ "$FAILED" = "true" ]; then
            echo "TESTS_FAILED=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Test SSH shortcuts
        run: |
          echo "🔍 Testing SSH configuration shortcuts..."

          # Test that shortcuts work
          docker exec tmux-test-client bash -c "
            echo '🧪 Testing SSH shortcuts...'

            # Test connection shortcuts
            ssh -o BatchMode=yes -o ConnectTimeout=5 server 'exit 0' 2>/dev/null || echo '⚠️ Need password for server connection'

            # List available shortcuts
            echo ''
            echo '📋 Configured shortcuts in client:'
            grep '^Host' /home/client/.ssh/config | grep -v '*' | sed 's/Host/  ssh/g'
          "

      - name: 📊 Generate test report
        if: always()
        run: |
          echo "## 🐳 Docker Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Server Container**: tmux-test-server" >> $GITHUB_STEP_SUMMARY
          echo "- **Client Container**: tmux-test-client" >> $GITHUB_STEP_SUMMARY
          echo "- **Network**: Docker bridge (172.25.0.0/24)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.tests.outputs.TESTS_FAILED }}" = "true" ]; then
            echo "### ❌ Status: Tests Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Status: All Tests Passed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ steps.tests.outputs.RESULTS_FILE }}" ]; then
            cat "${{ steps.tests.outputs.RESULTS_FILE }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "No test results available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Container Logs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker compose -f tests/docker/docker-compose.yml logs --tail=20 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 🧹 Cleanup
        if: always()
        run: |
          cd tests/docker
          docker compose down -v
          echo "✅ Docker cleanup complete"

      - name: ❌ Fail if tests failed
        if: steps.tests.outputs.TESTS_FAILED == 'true'
        run: |
          echo "❌ Docker tests failed!"
          exit 1

  docker-multi-server:
    name: 🌐 Multi-Server Docker Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'test-multi')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build server test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/docker/Dockerfile.server
          tags: ptty-tmux-server:latest
          load: true
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Tag second server image
        run: docker tag ptty-tmux-server:latest ptty-tmux-server2:latest

      - name: 🚀 Start multi-server environment
        run: |
          cd tests/docker
          docker compose --profile multi-server up -d

          echo "⏳ Waiting for all servers..."
          sleep 15

          docker compose ps

      - name: 🧪 Test server-to-server connections
        run: |
          echo "🧪 Testing multi-server setup..."

          # Install sshpass
          sudo apt-get update && sudo apt-get install -y sshpass

          # Test both servers
          echo "Testing Server 1 (port 2222)..."
          sshpass -p testpassword ssh -p 2222 -o StrictHostKeyChecking=no testuser@localhost "tmux ls"

          echo ""
          echo "Testing Server 2 (port 2223)..."
          sshpass -p testpassword ssh -p 2223 -o StrictHostKeyChecking=no testuser@localhost "tmux ls"

          # Test cross-server connection (from server1 to server2)
          echo ""
          echo "Testing cross-server SSH..."
          docker exec tmux-test-server bash -c "
            apt-get update && apt-get install -y sshpass
            sshpass -p testpassword ssh -o StrictHostKeyChecking=no testuser@tmux-server2 'tmux ls'
          "

      - name: 📊 Multi-server report
        if: always()
        run: |
          echo "## 🌐 Multi-Server Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Server 1**: Port 2222" >> $GITHUB_STEP_SUMMARY
          echo "- **Server 2**: Port 2223" >> $GITHUB_STEP_SUMMARY
          echo "- **Cross-server SSH**: Tested" >> $GITHUB_STEP_SUMMARY

      - name: 🧹 Cleanup
        if: always()
        run: |
          cd tests/docker
          docker compose --profile multi-server down -v
