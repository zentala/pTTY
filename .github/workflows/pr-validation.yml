name: 🔍 PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".plan/**"
      - "README*"
      - "LICENSE"
      - "CHANGELOG*"
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".plan/**"
      - "README*"
      - "LICENSE"
      - "CHANGELOG*"

env:
  TF_VERSION: "1.6.0"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Fast validation for all PRs
  quick-checks:
    name: ⚡ Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false

    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux shellcheck

      - name: 📋 Lint shell scripts
        run: |
          echo "🔍 Linting shell scripts..."
          find install.sh src tools tests/scripts -name "*.sh" -type f \
            ! -name "*old-backup.sh" | while read -r script; do
            echo "Checking: $script"
            shellcheck -S error "$script"
          done

      - name: ✅ Validate syntax
        run: |
          echo "🔍 Validating script syntax..."

          # Check main installer
          bash -n install.sh
          echo "✅ install.sh syntax valid"

          # Check source scripts
          for script in src/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
              echo "✅ $script syntax valid"
            fi
          done

          # Check test scripts
          for script in tests/scripts/*.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
              echo "✅ $script syntax valid"
            fi
          done

      - name: 🧪 Test tmux config
        run: |
          echo "🔍 Testing tmux configuration..."
          mkdir -p "$HOME/.tmux-persistent-console"
          cp -r src/. "$HOME/.tmux-persistent-console/"
          tmux -f src/tmux.conf start-server \; source-file src/tmux.conf \; list-keys >/dev/null
          echo "✅ Tmux configuration is valid"

      - name: 🔗 Validate tmux references
        run: |
          bash tools/check-tmux-references.sh

      - name: 📋 Validate SHA256SUMS manifest is up to date
        run: |
          bash tools/gen-sha256sums.sh --check

      - name: 🧪 Unit tests
        run: |
          bash tests/unit/test-session-list.sh

      - name: 🔗 Validate markdown links
        run: |
          bash tools/check-markdown-links.sh README.md CLAUDE.md

      - name: 🏗️ Validate Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔍 Terraform checks
        run: |
          cd tests/terraform
          echo "🔍 Terraform init..."
          terraform init -backend=false

          echo "🔍 Terraform validate..."
          terraform validate

          echo "🔍 Terraform format check..."
          terraform fmt -check=true -diff=true

          echo "✅ Terraform validation complete"

      - name: 📊 PR Summary
        run: |
          echo "## ✅ PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Shell Scripts**: All syntax checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Tmux Config**: Configuration validated" >> $GITHUB_STEP_SUMMARY
          echo "- **Terraform**: Infrastructure code validated" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Ready for review 🚀" >> $GITHUB_STEP_SUMMARY

  # Security scan for PRs
  security-check:
    name: 🔒 Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TruffleHog diffs base..head — only meaningful on pull_request events
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false

    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Scan for secrets
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: 🛡️ Terraform security scan
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: tests/terraform
          framework: terraform
          output_format: cli
          soft_fail: true
          log_level: WARNING

  # Documentation checks
  docs-check:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false

    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4

      - name: 🔍 Check release-facing markdown links
        run: |
          bash tools/check-markdown-links.sh \
            README.md \
            CLAUDE.md \
            docs/troubleshooting.md \
            docs/windows-terminal.md \
            docs/SPEC.md \
            CONTRIBUTING.md

      - name: 📋 Validate README updates
        run: |
          if git diff --name-only origin/main...HEAD | grep -q "README.md"; then
            echo "📝 README.md was updated in this PR"
            echo "📋 Checking README structure..."

            # Check for required sections
            required_sections=("Features" "Quick Start" "Installation" "Usage")
            for section in "${required_sections[@]}"; do
              if grep -q "## .*$section" README.md; then
                echo "✅ Found section: $section"
              else
                echo "❌ Missing section: $section"
                exit 1
              fi
            done
          else
            echo "📝 README.md not modified in this PR"
          fi

  # Fast native check: all 10 console sessions come up from a clean tmux server
  session-sanity:
    name: 🖥️ Session Sanity
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: 🚀 Start tmux server and create console sessions
        run: |
          mkdir -p "$HOME/.tmux-persistent-console"
          cp -r src/. "$HOME/.tmux-persistent-console/"
          tmux -f src/tmux.conf start-server
          bash src/setup.sh

      - name: ✅ Assert 10 console-* sessions exist
        run: |
          COUNT=$(tmux ls | grep -c '^console-')
          echo "Found $COUNT console-* sessions"
          if [ "$COUNT" -ne 10 ]; then
            echo "::error::expected 10 console-* sessions, found $COUNT"
            exit 1
          fi
          tmux has-session -t console-1
          tmux has-session -t console-10
          echo "✅ console-1 and console-10 both present"

  # Fast pure-bash check: install.sh, CHANGELOG.md (and a release tag) agree
  version-consistency:
    name: 🔢 Version Consistency
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Compare install.sh, CHANGELOG.md, and tag versions
        run: |
          INSTALL_VERSION=$(grep -oP '^PTTY_VERSION="\K[^"]+' install.sh)
          echo "install.sh PTTY_VERSION: $INSTALL_VERSION"

          CHANGELOG_VERSION=$(grep -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md | head -1)
          echo "CHANGELOG.md top entry: $CHANGELOG_VERSION"

          if [ -z "$INSTALL_VERSION" ] || [ -z "$CHANGELOG_VERSION" ]; then
            echo "::error::could not extract a version from install.sh or CHANGELOG.md"
            exit 1
          fi

          if [ "$INSTALL_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::install.sh PTTY_VERSION ($INSTALL_VERSION) != CHANGELOG.md top entry ($CHANGELOG_VERSION)"
            exit 1
          fi
          echo "✅ install.sh and CHANGELOG.md agree on $INSTALL_VERSION"

          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Tag version: $TAG_VERSION"
            if [ "$TAG_VERSION" != "$INSTALL_VERSION" ]; then
              echo "::error::tag (v$TAG_VERSION) does not match install.sh/CHANGELOG version ($INSTALL_VERSION)"
              exit 1
            fi
            echo "✅ Tag matches install.sh/CHANGELOG version"
          fi

      # The public one-liner serves install.sh from main, which then downloads
      # payload files from tag v$PTTY_VERSION. main is broken for every new
      # user whenever that tag does not serve SHA256SUMS (the v0.2.0
      # incident). Retries because raw.githubusercontent.com can lag a fresh
      # tag push by a few seconds.
      - name: 🌐 Released ref serves SHA256SUMS (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          INSTALL_VERSION=$(grep -oP '^PTTY_VERSION="\K[^"]+' install.sh)
          RAW_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${INSTALL_VERSION}/SHA256SUMS"
          echo "Checking $RAW_URL"
          for i in $(seq 1 12); do
            if curl -fsSL "$RAW_URL" -o /dev/null; then
              echo "✅ v$INSTALL_VERSION serves SHA256SUMS — the one-liner works"
              exit 0
            fi
            sleep 5
          done
          echo "::error::install.sh on main points at v$INSTALL_VERSION but $RAW_URL is unreachable — every fresh install fails. Cut the release with scripts/release.sh."
          exit 1

  # Native systemd roundtrip: install.sh's real (non-CI-shortcut) path installs
  # the autostart service, then the shipped uninstaller must remove every
  # trace of it. Runs on the bare runner (not Docker — the Docker test harness
  # in tests/docker/ does not run systemd inside its containers) because
  # GitHub's ubuntu-latest runners are real VMs with systemd as PID 1.
  install-uninstall-roundtrip:
    name: 🔁 Install/Uninstall Roundtrip
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: 🔌 Start a user systemd session
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          {
            echo "XDG_RUNTIME_DIR=/run/user/$(id -u)"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus"
          } >> "$GITHUB_ENV"

      - name: 📦 Run install.sh (real systemd path)
        run: |
          # Actions sets CI=true, which install.sh treats as a container/CI
          # shortcut and skips the systemd service entirely. Unset it so this
          # job exercises the real end-user install path we ship.
          unset CI CONTAINER
          bash install.sh

      - name: 🩺 Service diagnostics on failure
        if: failure()
        run: |
          systemctl --user status tmux-console.service --no-pager || true
          journalctl --user -u tmux-console.service -n 50 --no-pager || true

      - name: ✅ Verify service enabled and sessions exist
        run: |
          systemctl --user is-enabled tmux-console.service
          COUNT=$(tmux ls | grep -c '^console-')
          if [ "$COUNT" -ne 10 ]; then
            echo "::error::expected 10 console-* sessions after install, found $COUNT"
            exit 1
          fi

      - name: 🗑️ Run the shipped uninstaller
        run: bash "$HOME/bin/uninstall-console"

      - name: ✅ Assert uninstall left no trace
        run: |
          if systemctl --user is-enabled tmux-console.service 2>/dev/null; then
            echo "::error::tmux-console.service is still enabled after uninstall"
            exit 1
          fi
          if [ -f "$HOME/.config/systemd/user/tmux-console.service" ]; then
            echo "::error::service unit file was not removed"
            exit 1
          fi
          if tmux ls 2>/dev/null | grep -q '^console-'; then
            echo "::error::console-* sessions still present after uninstall"
            exit 1
          fi
          for rc in "$HOME/.bashrc" "$HOME/.zshrc"; do
            if [ -f "$rc" ] && grep -qF "# >>> pTTY >>>" "$rc"; then
              echo "::error::pTTY rc block still present in $rc"
              exit 1
            fi
          done
          echo "✅ uninstall left no systemd unit, no sessions, no rc blocks"

  # Changes analysis
  change-detection:
    name: 🔍 Change Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs_cloud_test: ${{ steps.changes.outputs.needs_cloud_test }}
      test_type: ${{ steps.changes.outputs.test_type }}

    steps:
      - name: 📥 Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Detect changes
        id: changes
        run: |
          echo "🔍 Analyzing changes in PR..."

          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Determine if cloud testing is needed
          NEEDS_CLOUD_TEST=false
          TEST_TYPE="quick"

          # Check for critical changes that need cloud testing
          if echo "$CHANGED_FILES" | grep -E "(src/|install\.sh|tests/terraform/|tests/configs/)"; then
            echo "🚨 Critical files changed - cloud testing recommended"
            NEEDS_CLOUD_TEST=true
            TEST_TYPE="full"
          fi

          # Check for test-only changes
          if echo "$CHANGED_FILES" | grep -q "tests/scripts/" && ! echo "$CHANGED_FILES" | grep -v "tests/"; then
            echo "🧪 Test scripts changed - quick cloud test"
            NEEDS_CLOUD_TEST=true
            TEST_TYPE="quick"
          fi

          # Check PR labels for forced testing
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'test-cloud') }}" == "true" ]]; then
            echo "🏷️ test-cloud label found - forcing cloud test"
            NEEDS_CLOUD_TEST=true
            TEST_TYPE="full"
          fi

          echo "needs_cloud_test=$NEEDS_CLOUD_TEST" >> $GITHUB_OUTPUT
          echo "test_type=$TEST_TYPE" >> $GITHUB_OUTPUT

          echo "## 📊 Change Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Testing Needed**: $NEEDS_CLOUD_TEST" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Type**: $TEST_TYPE" >> $GITHUB_STEP_SUMMARY

  # DISABLED: Conditional cloud testing for PRs
  # TODO: Re-enable when cloud testing is ready
  # Currently using Docker-based testing instead (see docker-test.yml)
  #
  # cloud-test-pr:
  #   name: ☁️ Cloud Test (PR)
  #   uses: ./.github/workflows/test-infrastructure.yml
  #   needs: [quick-checks, change-detection]
  #   if: |
  #     needs.change-detection.outputs.needs_cloud_test == 'true' &&
  #     github.event.pull_request.draft == false
  #   secrets: inherit
  #   with:
  #     test_type: ${{ needs.change-detection.outputs.test_type }}
  #     keep_infrastructure: false

  # Final PR status check
  pr-status:
    name: 📋 PR Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quick-checks, security-check, docs-check, change-detection]
    if: always()

    steps:
      - name: 📊 Generate PR status
        run: |
          echo "## 🎯 PR Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check individual job statuses
          QUICK_STATUS="${{ needs.quick-checks.result }}"
          SECURITY_STATUS="${{ needs.security-check.result }}"
          DOCS_STATUS="${{ needs.docs-check.result }}"

          echo "### ✅ Validation Results" >> $GITHUB_STEP_SUMMARY

          if [[ "$QUICK_STATUS" == "success" ]]; then
            echo "- 🚀 **Quick Checks**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 🚀 **Quick Checks**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$SECURITY_STATUS" == "success" ]]; then
            echo "- 🔒 **Security**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 🔒 **Security**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$DOCS_STATUS" == "success" ]]; then
            echo "- 📚 **Documentation**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 📚 **Documentation**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Testing status
          echo "- 🐳 **Docker Testing**: Check docker-test.yml workflow for integration tests" >> $GITHUB_STEP_SUMMARY
          echo "- ☁️ **Cloud Testing**: Disabled (Docker-based testing active)" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎉 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Review and address any failed checks" >> $GITHUB_STEP_SUMMARY
          echo "- Wait for all workflows to complete" >> $GITHUB_STEP_SUMMARY
          echo "- Ready for merge when all checks pass! 🚀" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if critical checks failed
        if: |
          needs.quick-checks.result == 'failure' ||
          needs.security-check.result == 'failure'
        run: |
          echo "❌ Critical validation checks failed!"
          echo "Please fix the issues before merging."
          exit 1
